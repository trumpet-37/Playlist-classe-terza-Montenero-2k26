<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist della Classe</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212; /* Sfondo scuro elegante */
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      color: #1db954; /* Verde Spotify */
      margin-bottom: 8px;
      text-align: center;
    }
    p {
      color: #b3b3b3;
      margin-bottom: 24px;
      text-align: center;
    }
    .player-container {
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
      background-color: #181818;
    }
    /* Rende il player Spotify responsivo ed adattabile a tutti gli schermi */
    .player-container iframe {
      width: 100%;
      height: 450px;
      border: 0;
    }
  </style>
</head>
<body>

  <h1>🎵 La Playlist della Nostra Classe</h1>
  <p>Ascolta i brani scelti insieme direttamente dal browser!</p>

  <div class="player-container">
    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/45pIzgftGM0pnffcOhuC5K?utm_source=generator&si=13f04d2648d04ced" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    
  </div>

</body>
</html>
